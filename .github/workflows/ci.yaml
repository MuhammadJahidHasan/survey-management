name: Survey management

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

  permission:
   contents: read
   packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build
      
      - name: Build docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/survey-api:${{ github.sha }} .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/survey-api:${{ github.sha }}