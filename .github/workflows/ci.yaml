name: Suevey management

on:
 push:
  branches:
   - master
   - develop
 pull_request:
  branches:
   - master
   - develop
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout repo
     uses: actions/checkout@v4

   - name: Setup node
     uses: actions/setup-node@v4
     with:
      node-version: 22

   - name: Install depedencies
     run: npm ci
   - name: Build Project
     run: npm run build